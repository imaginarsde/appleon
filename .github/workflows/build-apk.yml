name: Build APPLEON APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare offline web assets
        run: |
          set -euxo pipefail
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cat payload/web.zip.part* > web_bundle.zip
          echo "e33773b1013ea842aa12d983038b5ce2e64c1e6ccb3da54c7d396955eb1b6b5a  web_bundle.zip" | sha256sum -c -
          unzip -q web_bundle.zip -d app/src/main/assets
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/assets/images/home.webp
          test -s app/src/main/assets/assets/images/modal_alimentacion.webp
          test -s app/src/main/assets/assets/audio/tap.mp3
          test -s app/src/main/assets/js/app.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK with official Android toolchain
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk appleon.apk

      - name: Validate APK
        run: |
          unzip -l appleon.apk | grep 'assets/index.html'
          unzip -l appleon.apk | grep 'assets/assets/images/home.webp'
          unzip -l appleon.apk | grep 'assets/assets/images/modal_alimentacion.webp'
          unzip -l appleon.apk | grep 'assets/js/app.js'
          unzip -t appleon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: appleon-apk
          path: appleon.apk
